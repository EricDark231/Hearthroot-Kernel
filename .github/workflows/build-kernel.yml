name: build-kernel

# 手动触发的 rodin 内核构建（参考 ABK build.yml 的核心编译流程裁剪）：
#   clang-r596125 -> gki_defconfig -> Image + Image.lz4 (LZ4 legacy)
#   -> AnyKernel3 可刷包（内核 blob 命名为 Image，内容为 lz4 legacy 格式，
#      设备启动时只认名为 Image 的 blob）
#   + 与 drivers/kernelsu/.sukisu_tag 锚定的 SukiSU-Ultra release 配套管理器
#     （标准版 + 伪装版各取一个资产 APK，资产名里的公式版本值与 Kbuild 钉版
#      按公式换算交叉核对；伪装版缺失时降级为仅标准版）

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  KERNEL_BRANCH: bsp-rodin-v-upstream
  CLANG_VER: clang-r596125
  # clang-r596125 预编译目录所在的 googlesource 分支（注意不是
  # mirror-goog-llvm-r596125-release，那是 LLVM 源码镜像，没有预编译产物）
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source
  SUKISU_REPO: SukiSU-Ultra/SukiSU-Ultra
  # 构建时主机标识：内核 banner 会显示为 Kbuild@114514
  BUILD_USER: Kbuild
  BUILD_HOST: '114514'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison bc libelf-dev libssl-dev dwarves lz4 zip unzip

      - name: Set build host name (Kbuild@114514)
        run: |
          set -euo pipefail
          # hostname 本身不允许 '@'，所以 runner 主机名用等价的合法写法，
          # 并额外用 KBUILD_BUILD_USER/HOST 让内核 banner 精确显示 Kbuild@114514
          sudo hostname 'Kbuild@114514' 2>/dev/null \
            || sudo hostnamectl set-hostname 'Kbuild-114514' 2>/dev/null \
            || true
          echo "runner hostname now: $(hostname)"
          {
            echo "KBUILD_BUILD_USER=${BUILD_USER}"
            echo "KBUILD_BUILD_HOST=${BUILD_HOST}"
          } >> "$GITHUB_ENV"
          echo "kernel banner will report: ${BUILD_USER}@${BUILD_HOST}"

      - name: Download clang-r596125
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          mkdir -p "$CLANG_DIR"
          # 1) 分支直链（+archive） 2) 固定 commit 直链 3) 稀疏克隆兜底
          URLS=(
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/8b6826407e25a197d7cf7ceacab0bf67c11173de/${CLANG_VER}.tar.gz"
          )
          ok=""
          for url in "${URLS[@]}"; do
            echo "trying $url"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            if curl -fL --retry 3 --connect-timeout 30 --max-time 1200 "$url" -o "$RUNNER_TEMP/clang.tgz" \
               && tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$CLANG_DIR"; then
              if [ -x "$CLANG_DIR/bin/clang" ]; then
                ok=yes
              elif [ -x "$CLANG_DIR/$CLANG_VER/bin/clang" ]; then
                mv "$CLANG_DIR/$CLANG_VER"/* "$CLANG_DIR"/ && ok=yes
              fi
              [ -n "$ok" ] && break
            fi
            echo "::warning::download/extract failed: $url"
          done
          if [ -z "$ok" ]; then
            echo "::warning::archive endpoints failed, falling back to sparse git clone"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            git clone --depth=1 --filter=blob:none --sparse -b "$CLANG_BRANCH" \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$RUNNER_TEMP/clang-src"
            git -C "$RUNNER_TEMP/clang-src" sparse-checkout set "$CLANG_VER"
            mv "$RUNNER_TEMP/clang-src/$CLANG_VER"/* "$CLANG_DIR"/
          fi
          test -x "$CLANG_DIR/bin/clang" || { echo "::error::clang binary not found after download"; ls -la "$CLANG_DIR"; exit 1; }
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version

      - name: Build kernel (gki_defconfig -> Image + Image.lz4)
        run: |
          set -euo pipefail
          # BUILD-GUIDE.md：只能用 gki_defconfig 生成用于编译的 .config
          make ARCH=arm64 LLVM=1 gki_defconfig
          JOBS="$(nproc)"
          echo "building with ${JOBS} jobs"
          make ARCH=arm64 LLVM=1 -j"$JOBS" Image Image.lz4
          # 校验 LZ4 legacy 魔数 0x184C2102（BUILD-GUIDE.md 要求）；不是 legacy 就用 lz4 -l 重压
          MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
          if [ "$MAGIC" != "02214c18" ]; then
            echo "::warning::Image.lz4 magic $MAGIC is not lz4 legacy - recompressing with 'lz4 -l'"
            lz4 -f -l -9 arch/arm64/boot/Image arch/arm64/boot/Image.lz4
            MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
            [ "$MAGIC" = "02214c18" ] || { echo "::error::Image.lz4 still not lz4 legacy (magic: $MAGIC)"; exit 1; }
          fi
          KERNEL_RELEASE=$(cat include/config/kernel.release)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3 flashable tree
        run: |
          set -euo pipefail
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git
          rm -rf AnyKernel3/.git
          # 设备启动只认名为 Image 的 blob；内容为 lz4 legacy 压缩的内核
          cp arch/arm64/boot/Image.lz4 AnyKernel3/Image
          sed -i "s|^kernel.string=.*|kernel.string=Rodin ${KERNEL_RELEASE} (SukiSU-Ultra)|" AnyKernel3/anykernel.sh
          # 不再打包外层 zip：artifact 下载下来本身就是可刷的 AK3 zip

      - name: Fetch SukiSU-Ultra manager APKs for the anchored release
        id: fetch_manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sync-sukisu 落地时写入的锚：drivers/kernelsu/.sukisu_tag（release tag）
          TAG=$(cat drivers/kernelsu/.sukisu_tag 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "::warning::no .sukisu_tag anchor - falling back to latest stable release"
            TAG=$(gh api "repos/$SUKISU_REPO/releases/latest" --jq .tag_name)
          fi
          REL=$(gh api "repos/$SUKISU_REPO/releases/tags/$TAG")
          [ "$(echo "$REL" | jq -r .prerelease)" = "false" ] || { echo "::error::$TAG is a prerelease"; exit 1; }
          # 标准/伪装两版资产名只差 -spoofed 后缀且伪装版字典序在前，
          # 必须按后缀分别挑选：统一 head -n1 会恒选中伪装版、标准版永不入库
          PLAIN_NAME=$(echo "$REL" | jq -r '.assets[].name' | grep -E '^SukiSU_.*\.apk$' | grep -v spoofed | head -n1 || true)
          SPOOF_NAME=$(echo "$REL" | jq -r '.assets[].name' | grep -E '^SukiSU_.*-spoofed\.apk$' | head -n1 || true)
          [ -n "$PLAIN_NAME" ] || { echo "::error::no standard manager APK asset on release $TAG"; exit 1; }
          KSU_KBUILD=drivers/kernelsu/Kbuild
          V_BASE=$(grep -E '^VERSION_BASE[[:space:]]+:=[[:space:]]+[0-9]+$' "$KSU_KBUILD" | awk '{print $3}')
          V_OFFSET=$(grep -E '^VERSION_OFFSET[[:space:]]+:=[[:space:]]+[0-9]+$' "$KSU_KBUILD" | awk '{print $3}')
          PINNED=$(grep -E '^git_commit_count = [0-9]+$' "$KSU_KBUILD" | awk '{print $3}')
          # 管理器与落地模块交叉核对：资产名里的数字是官方公式值
          # KSU_VERSION = VERSION_BASE + count - VERSION_OFFSET（与 manager 同源），
          # 不是裸 commit count，须按 Kbuild 常量换算后再比
          # （v4.3.0：40000 + 3915 - 2815 = 41100；裸 count 直接比对口径错位恒不等）
          EXPECTED=$(( ${V_BASE:-0} + ${PINNED:-0} - ${V_OFFSET:-0} ))
          for name in "$PLAIN_NAME" ${SPOOF_NAME:+"$SPOOF_NAME"}; do
            # [^_]* 兼容 v4.2.1-r2 这类带 -rN 后缀的版本段，否则 count 恒为空、核对静默失效
            REL_COUNT=$(echo "$name" | sed -n 's/^SukiSU_v[^_]*_\([0-9]*\).*\.apk$/\1/p')
            if [ -n "$REL_COUNT" ] && [ -n "$PINNED" ] && [ -n "$V_BASE" ] && [ -n "$V_OFFSET" ] \
               && [ "$REL_COUNT" != "$EXPECTED" ]; then
              echo "::error::$name: release $TAG asset value $REL_COUNT != Kbuild formula $EXPECTED (base $V_BASE + count $PINNED - offset $V_OFFSET) - module/manager pairing mismatch"
              exit 1
            fi
          done
          rm -rf manager manager-spoofed && mkdir -p manager manager-spoofed
          curl -fL --retry 3 --connect-timeout 30 "$(echo "$REL" | jq -r --arg n "$PLAIN_NAME" '.assets[] | select(.name==$n) | .browser_download_url')" -o "manager/$PLAIN_NAME"
          [ "$(stat -c%s "manager/$PLAIN_NAME")" -gt 1000000 ] || { echo "::error::standard manager APK looks too small"; exit 1; }
          HAS_SPOOF=no
          if [ -n "$SPOOF_NAME" ]; then
            curl -fL --retry 3 --connect-timeout 30 "$(echo "$REL" | jq -r --arg n "$SPOOF_NAME" '.assets[] | select(.name==$n) | .browser_download_url')" -o "manager-spoofed/$SPOOF_NAME"
            [ "$(stat -c%s "manager-spoofed/$SPOOF_NAME")" -gt 1000000 ] || { echo "::error::spoofed manager APK looks too small"; exit 1; }
            HAS_SPOOF=yes
          else
            echo "::warning::release $TAG has no spoofed manager asset - shipping standard manager only"
          fi
          echo "SUKISU_RELEASE_URL=https://github.com/$SUKISU_REPO/releases/tag/$TAG" >> "$GITHUB_ENV"
          echo "has_spoofed=${HAS_SPOOF}" >> "$GITHUB_OUTPUT"
          echo "manager APKs: ${PLAIN_NAME} + ${SPOOF_NAME:-<none>} (release $TAG)"
          ls -la manager manager-spoofed

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          # artifact 根目录即 AK3 包内容（anykernel.sh / Image / META-INF/...），
          # 下载得到的 zip 无需再解包即可刷入
          name: Rodin-${{ env.KERNEL_RELEASE }}-AnyKernel3
          path: AnyKernel3/**
          if-no-files-found: error

      - name: Upload SukiSU-Ultra manager APK (standard)
        uses: actions/upload-artifact@v4
        with:
          name: rodin-${{ env.KERNEL_RELEASE }}-manager
          path: manager/*.apk
          if-no-files-found: error

      - name: Upload SukiSU-Ultra manager APK (spoofed)
        if: steps.fetch_manager.outputs.has_spoofed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: rodin-${{ env.KERNEL_RELEASE }}-manager-spoofed
          path: manager-spoofed/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Rodin kernel build"
            echo "- kernel: \`${KERNEL_RELEASE}\` (Image.lz4 = lz4 legacy, magic 02214c18 verified)"
            echo "- build host: Kbuild@114514"
            echo "- AK3 flashable zip: artifact \`Rodin-${KERNEL_RELEASE}-AnyKernel3\` (downloaded zip is directly flashable, kernel blob Image = lz4 legacy)"
            echo "- SukiSU-Ultra managers: artifacts \`rodin-${KERNEL_RELEASE}-manager\` + \`rodin-${KERNEL_RELEASE}-manager-spoofed\` (when available) from [release]($SUKISU_RELEASE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
