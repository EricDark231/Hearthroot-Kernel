name: build-kernel

# 手动触发的 rodin 内核构建（参考 ABK build.yml 的核心编译流程裁剪）：
#   clang-r596125 -> gki_defconfig -> Image + Image.lz4 (LZ4 legacy)
#   -> AnyKernel3 可刷包（内核 blob 命名为 Image，内容为 lz4 legacy 格式，
#      设备启动时只认名为 Image 的 blob）
#   + 与内核树 drivers/kernelsu 落地版本一致的 ReSukiSU 管理器
#     （取 ReSukiSU/ReSukiSU main 分支 Build Manager CI 产物：release + spoofed）

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  KERNEL_BRANCH: hearthroot-dev
  CLANG_VER: clang-r596125
  # clang-r596125 预编译目录所在的 googlesource 分支（注意不是
  # mirror-goog-llvm-r596125-release，那是 LLVM 源码镜像，没有预编译产物）
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source
  RSU_REPO: ReSukiSU/ReSukiSU
  # 构建时主机标识：内核 banner 会显示为 EricDark231@Hearthroot
  BUILD_USER: EricDark231
  BUILD_HOST: 'Hearthroot'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison bc libelf-dev libssl-dev dwarves lz4 zip unzip

      - name: Set build host name (EricDark231@Hearthroot)
        run: |
          set -euo pipefail
          # hostname 本身不允许 '@'，所以 runner 主机名用等价的合法写法，
          # 并额外用 KBUILD_BUILD_USER/HOST 让内核 banner 精确显示 EricDark231@Hearthroot
          sudo hostname 'EricDark231@Hearthroot' 2>/dev/null \
            || sudo hostnamectl set-hostname 'Hearthroot' 2>/dev/null \
            || true
          echo "runner hostname now: $(hostname)"
          {
            echo "KBUILD_BUILD_USER=${BUILD_USER}"
            echo "KBUILD_BUILD_HOST=${BUILD_HOST}"
          } >> "$GITHUB_ENV"
          echo "kernel banner will report: ${BUILD_USER}@${BUILD_HOST}"

      - name: Download clang-r596125
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          mkdir -p "$CLANG_DIR"
          # 1) 分支直链（+archive） 2) 固定 commit 直链 3) 稀疏克隆兜底
          URLS=(
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/8b6826407e25a197d7cf7ceacab0bf67c11173de/${CLANG_VER}.tar.gz"
          )
          ok=""
          for url in "${URLS[@]}"; do
            echo "trying $url"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            if curl -fL --retry 3 --connect-timeout 30 --max-time 1200 "$url" -o "$RUNNER_TEMP/clang.tgz" \
               && tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$CLANG_DIR"; then
              if [ -x "$CLANG_DIR/bin/clang" ]; then
                ok=yes
              elif [ -x "$CLANG_DIR/$CLANG_VER/bin/clang" ]; then
                mv "$CLANG_DIR/$CLANG_VER"/* "$CLANG_DIR"/ && ok=yes
              fi
              [ -n "$ok" ] && break
            fi
            echo "::warning::download/extract failed: $url"
          done
          if [ -z "$ok" ]; then
            echo "::warning::archive endpoints failed, falling back to sparse git clone"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            git clone --depth=1 --filter=blob:none --sparse -b "$CLANG_BRANCH" \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$RUNNER_TEMP/clang-src"
            git -C "$RUNNER_TEMP/clang-src" sparse-checkout set "$CLANG_VER"
            mv "$RUNNER_TEMP/clang-src/$CLANG_VER"/* "$CLANG_DIR"/
          fi
          test -x "$CLANG_DIR/bin/clang" || { echo "::error::clang binary not found after download"; ls -la "$CLANG_DIR"; exit 1; }
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version

      - name: Build kernel (gki_defconfig -> Image + Image.lz4)
        run: |
          set -euo pipefail
          # BUILD-GUIDE.md：只能用 gki_defconfig 生成用于编译的 .config
          make ARCH=arm64 LLVM=1 gki_defconfig
          JOBS="$(nproc)"
          echo "building with ${JOBS} jobs"
          make ARCH=arm64 LLVM=1 -j"$JOBS" Image Image.lz4
          # 校验 LZ4 legacy 魔数 0x184C2102（BUILD-GUIDE.md 要求）；不是 legacy 就用 lz4 -l 重压
          MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
          if [ "$MAGIC" != "02214c18" ]; then
            echo "::warning::Image.lz4 magic $MAGIC is not lz4 legacy - recompressing with 'lz4 -l'"
            lz4 -f -l -9 arch/arm64/boot/Image arch/arm64/boot/Image.lz4
            MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
            [ "$MAGIC" = "02214c18" ] || { echo "::error::Image.lz4 still not lz4 legacy (magic: $MAGIC)"; exit 1; }
          fi
          KERNEL_RELEASE=$(cat include/config/kernel.release)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3 flashable tree
        run: |
          set -euo pipefail
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git
          rm -rf AnyKernel3/.git
          # Device expects the kernel blob to be named Image; its contents use legacy LZ4 compression
          cp arch/arm64/boot/Image.lz4 AnyKernel3/Image

          # Hearthroot custom AnyKernel3 installer
          cp packaging/anykernel/anykernel.sh AnyKernel3/anykernel.sh
          sed -i "s|@KERNEL_RELEASE@|${KERNEL_RELEASE}|g" AnyKernel3/anykernel.sh

          # Ensure the release placeholder was completely replaced
          if grep -q '@KERNEL_RELEASE@' AnyKernel3/anykernel.sh; then
            echo "::error::Hearthroot AnyKernel3 version placeholder was not replaced"
            exit 1
          fi
          # 不再打包外层 zip：artifact 下载下来本身就是可刷的 AK3 zip

      - name: Fetch matching ReSukiSU manager APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sync-resukisu 落地时固定在 drivers/kernelsu/Kbuild 里的 ReSukiSU commit
          RSU_SHA=$(grep -E '^KSU_COMMIT_SHA[[:space:]]*:= *[0-9a-f]{8}[[:space:]]*$' drivers/kernelsu/Kbuild | head -n1 | awk '{print $3}')
          echo "landed ReSukiSU commit: ${RSU_SHA:-<none>}"

          fetch_apks() { # $1 = ReSukiSU CI run id
            # 两个 artifact 的产物是同名的（都是 ReSukiSU_<ver>_<code>-<abi>-release.apk），
            # 所以必须各自解到独立目录：共用暂存目录时后解压的 spoofed 包会覆盖掉标准包，
            # 结果只剩 1 个 apk。解出的 spoofed 包再改名带 spoofed 标记，两者可共存。
            rm -rf manager manager-spoofed
            mkdir -p manager manager-spoofed
            local tmp="$RUNNER_TEMP/rsu-apks"
            rm -rf "$tmp" && mkdir -p "$tmp"

            # 1) 标准包 Manager-release -> manager/
            local art_rel
            art_rel=$(gh api "repos/$RSU_REPO/actions/runs/$1/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.name=="Manager-release" and .expired==false) | .id' | head -n1)
            [ -n "$art_rel" ] || return 1
            gh api "repos/$RSU_REPO/actions/artifacts/$art_rel/zip" > "$tmp/Manager-release.zip"
            unzip -oq "$tmp/Manager-release.zip" -d manager
            # 只保留 arm64-v8a 变体（剔除 universal / armeabi-v7a / riscv64 / x86_64）
            find manager -type f -name '*.apk' ! -name '*arm64-v8a*' -delete
            test -n "$(find manager -type f -name '*.apk')" || return 1

            # 2) spoofed 包 Spoofed-Manager-release -> manager-spoofed/
            local art_spf
            art_spf=$(gh api "repos/$RSU_REPO/actions/runs/$1/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.name=="Spoofed-Manager-release" and .expired==false) | .id' | head -n1)
            [ -n "$art_spf" ] || return 1
            gh api "repos/$RSU_REPO/actions/artifacts/$art_spf/zip" > "$tmp/Spoofed-Manager-release.zip"
            unzip -oq "$tmp/Spoofed-Manager-release.zip" -d manager-spoofed
            find manager-spoofed -type f -name '*.apk' ! -name '*arm64-v8a*' -delete
            test -n "$(find manager-spoofed -type f -name '*.apk')" || return 1

            # 3) spoofed 包改名（文件名加 spoofed 标记），避免与标准包在文件层面同名
            #    注意只判 basename：路径里的目录名 manager-spoofed 本身就含 spoofed
            local f b
            for f in manager-spoofed/*.apk; do
              [ -f "$f" ] || continue
              b=${f##*/}
              case "$b" in
                *spoofed*) continue ;;
              esac
              mv "$f" "manager-spoofed/${b%-release.apk}-spoofed-release.apk" 2>/dev/null \
                || mv "$f" "manager-spoofed/${b%.apk}-spoofed.apk"
            done

            # 两个目录都必须有产物，缺一即换下一个候选 run
            local n1 n2
            n1=$(find manager -type f -name '*.apk' | wc -l)
            n2=$(find manager-spoofed -type f -name '*.apk' | wc -l)
            [ "$n1" -ge 1 ] && [ "$n2" -ge 1 ] || { echo "::error::expected arm64-v8a manager APKs in both manager and manager-spoofed, got ($n1, $n2)"; return 1; }
          }

          # El Manager debe provenir exactamente del mismo commit de ReSukiSU
          # integrado en el kernel. Kbuild conserva el SHA corto (8 caracteres),
          # mientras que GitHub Actions devuelve el SHA completo.
          [ -n "${RSU_SHA:-}" ] || {
            echo "::error::could not determine landed ReSukiSU commit from drivers/kernelsu/Kbuild"
            exit 1
          }

          RUN_ID=""
          RSU_MANAGER_SHA=""

          for page in 1 2 3 4 5; do
            echo "searching ReSukiSU Build Manager runs for ${RSU_SHA} (page ${page})"

            while IFS=$'\t' read -r cand cand_sha; do
              [ -n "$cand" ] || continue
              [ -n "$cand_sha" ] || continue

              case "$cand_sha" in
                "${RSU_SHA}"*)
                  echo "found matching Build Manager run ${cand} (${cand_sha})"
                  if fetch_apks "$cand"; then
                    RUN_ID="$cand"
                    RSU_MANAGER_SHA="$cand_sha"
                    break 2
                  else
                    echo "::warning::matching run ${cand} has no usable Manager artifacts"
                  fi
                  ;;
              esac
            done < <(
              gh api "repos/$RSU_REPO/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=100&page=${page}" \
                --jq '.workflow_runs[] | [.id, .head_sha] | @tsv'
            )
          done

          [ -n "$RUN_ID" ] || {
            echo "::error::no usable ReSukiSU Build Manager artifacts found for kernel commit ${RSU_SHA}"
            exit 1
          }

          case "$RSU_MANAGER_SHA" in
            "${RSU_SHA}"*) ;;
            *)
              echo "::error::ReSukiSU Manager commit ${RSU_MANAGER_SHA} does not match kernel commit ${RSU_SHA}"
              exit 1
              ;;
          esac
          RSU_MANAGER_SHA_SHORT="${RSU_MANAGER_SHA:0:12}"
          RSU_RUN_URL="https://github.com/$RSU_REPO/actions/runs/$RUN_ID"

          echo "ReSukiSU kernel commit : ${RSU_SHA:-unknown}"
          echo "ReSukiSU Manager commit: ${RSU_MANAGER_SHA}"
          echo "ReSukiSU Manager run   : ${RUN_ID}"

          {
            echo "RSU_KERNEL_SHA=${RSU_SHA:-unknown}"
            echo "RSU_MANAGER_SHA=${RSU_MANAGER_SHA}"
            echo "RSU_MANAGER_SHA_SHORT=${RSU_MANAGER_SHA_SHORT}"
            echo "RSU_RUN_ID=${RUN_ID}"
            echo "RSU_RUN_URL=${RSU_RUN_URL}"
          } >> "$GITHUB_ENV"

          ls -la manager manager-spoofed

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          # artifact 根目录即 AK3 包内容（anykernel.sh / Image / META-INF/...），
          # 下载得到的 zip 无需再解包即可刷入
          name: Hearthroot-rodin-${{ env.KERNEL_RELEASE }}-AnyKernel3
          path: AnyKernel3/**
          if-no-files-found: error

      - name: Upload ReSukiSU manager APK (release, arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Manager-arm64-v8a
          path: manager/*.apk
          if-no-files-found: error

      - name: Upload ReSukiSU manager APK (spoofed, arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Manager-Spoofed-arm64-v8a
          path: manager-spoofed/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Hearthroot Kernel"
            echo "- kernel: \`${KERNEL_RELEASE}\` (Image.lz4 = lz4 legacy, magic 02214c18 verified)"
            echo "- build host: EricDark231@Hearthroot"
            echo "- AK3 flashable zip: artifact \`Hearthroot-rodin-${KERNEL_RELEASE}-AnyKernel3\` (downloaded zip is directly flashable, kernel blob Image = lz4 legacy)"
            echo "- ReSukiSU kernel commit: \`${RSU_KERNEL_SHA}\`"
            echo "- ReSukiSU Manager dev: \`${RSU_MANAGER_SHA_SHORT}\` from main ([CI run]\($RSU_RUN_URL))"
            echo "- ReSukiSU Manager artifacts: \`ReSukiSU-Manager-arm64-v8a\` / \`ReSukiSU-Manager-Spoofed-arm64-v8a\`"
          } >> "$GITHUB_STEP_SUMMARY"
