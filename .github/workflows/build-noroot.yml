name: Hearthroot No Root Build

# 手动触发的 rodin 内核构建（参考 ABK build.yml 的核心编译流程裁剪）：
#   clang-r596125 -> gki_defconfig -> Image + Image.lz4 (LZ4 legacy)
#   -> AnyKernel3 可刷包（内核 blob 命名为 Image，内容为 lz4 legacy 格式，
#      设备启动时只认名为 Image 的 blob）

on:
  workflow_dispatch:
  push:
    branches:
      - hearthroot-noroot

permissions:
  contents: read
  actions: read

env:
  KERNEL_BRANCH: hearthroot-noroot
  CLANG_VER: clang-r596125
  # clang-r596125 预编译目录所在的 googlesource 分支（注意不是
  # mirror-goog-llvm-r596125-release，那是 LLVM 源码镜像，没有预编译产物）
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source
  # 构建时主机标识：内核 banner 会显示为 EricDark231@Hearthroot-NoRoot
  BUILD_USER: EricDark231
  BUILD_HOST: 'Hearthroot-NoRoot'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison bc libelf-dev libssl-dev dwarves lz4 zip unzip

      - name: Configure Hearthroot build identity
        run: |
          set -euo pipefail
          {
            echo "KBUILD_BUILD_USER=${BUILD_USER}"
            echo "KBUILD_BUILD_HOST=${BUILD_HOST}"
          } >> "$GITHUB_ENV"
          echo "kernel banner will report: ${BUILD_USER}@${BUILD_HOST}"

      - name: Restore Clang toolchain cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: hearthroot-clang-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_VER }}-8b6826407e25-v1

      - name: Download clang-r596125
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          mkdir -p "$CLANG_DIR"
          # 1) 分支直链（+archive） 2) 固定 commit 直链 3) 稀疏克隆兜底
          URLS=(
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/8b6826407e25a197d7cf7ceacab0bf67c11173de/${CLANG_VER}.tar.gz"
          )
          ok=""
          for url in "${URLS[@]}"; do
            echo "trying $url"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            if curl -fL --retry 3 --connect-timeout 30 --max-time 1200 "$url" -o "$RUNNER_TEMP/clang.tgz" \
               && tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$CLANG_DIR"; then
              if [ -x "$CLANG_DIR/bin/clang" ]; then
                ok=yes
              elif [ -x "$CLANG_DIR/$CLANG_VER/bin/clang" ]; then
                mv "$CLANG_DIR/$CLANG_VER"/* "$CLANG_DIR"/ && ok=yes
              fi
              [ -n "$ok" ] && break
            fi
            echo "::warning::download/extract failed: $url"
          done
          if [ -z "$ok" ]; then
            echo "::warning::archive endpoints failed, falling back to sparse git clone"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            git clone --depth=1 --filter=blob:none --sparse -b "$CLANG_BRANCH" \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$RUNNER_TEMP/clang-src"
            git -C "$RUNNER_TEMP/clang-src" sparse-checkout set "$CLANG_VER"
            mv "$RUNNER_TEMP/clang-src/$CLANG_VER"/* "$CLANG_DIR"/
          fi
          test -x "$CLANG_DIR/bin/clang" || { echo "::error::clang binary not found after download"; ls -la "$CLANG_DIR"; exit 1; }
          "$CLANG_DIR/bin/clang" --version

      - name: Activate Clang toolchain
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          test -x "$CLANG_DIR/bin/clang"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version

      - name: Build kernel (gki_defconfig -> Image + Image.lz4)
        run: |
          set -euo pipefail
          # BUILD-GUIDE.md：只能用 gki_defconfig 生成用于编译的 .config
          make ARCH=arm64 LLVM=1 gki_defconfig

          echo "Validating Hearthroot No Root configuration..."

          grep -qx 'CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y' .config
          grep -qx 'CONFIG_MQ_IOSCHED_KYBER=y' .config
          grep -qx 'CONFIG_MQ_IOSCHED_DEADLINE=y' .config

          if grep -Eq '^CONFIG_MQ_IOSCHED_ADIOS=y' .config; then
            echo "::error::ADIOS must not be enabled in No Root"
            exit 1
          fi

          echo "Configuration validated."
          JOBS="$(nproc)"
          echo "building with ${JOBS} jobs"
          make ARCH=arm64 LLVM=1 -j"$JOBS" Image Image.lz4
          # 校验 LZ4 legacy 魔数 0x184C2102（BUILD-GUIDE.md 要求）；不是 legacy 就用 lz4 -l 重压
          MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
          if [ "$MAGIC" != "02214c18" ]; then
            echo "::warning::Image.lz4 magic $MAGIC is not lz4 legacy - recompressing with 'lz4 -l'"
            lz4 -f -l -9 arch/arm64/boot/Image arch/arm64/boot/Image.lz4
            MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
            [ "$MAGIC" = "02214c18" ] || { echo "::error::Image.lz4 still not lz4 legacy (magic: $MAGIC)"; exit 1; }
          fi
          KERNEL_RELEASE=$(cat include/config/kernel.release)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Prepare Hearthroot No Root installer
        run: |
          set -euo pipefail

          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git
          rm -rf AnyKernel3/.git
          # AOSP Recovery compatibility:
          # Use BusyBox hard links instead of symbolic links.
          python3 - <<'AK3PATCH'
          from pathlib import Path

          path = Path("AnyKernel3/META-INF/com/google/android/update-binary")
          text = path.read_text()

          old = "$bb --install -s bin;"
          new = "$bb --install bin;"

          if text.count(old) != 1:
              raise SystemExit("Unexpected AnyKernel3 BusyBox installer")

          path.write_text(text.replace(old, new, 1))
          print("AnyKernel3 BusyBox hardlink patch applied")
          AK3PATCH


          cp .github/anykernel/anykernel.sh AnyKernel3/anykernel.sh
          cp arch/arm64/boot/Image.lz4 AnyKernel3/Image

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh
          test -f AnyKernel3/Image

          sh -n AnyKernel3/anykernel.sh

          mkdir -p out
          (
            cd AnyKernel3
            zip -qr ../out/Hearthroot-NoRoot-${KERNEL_RELEASE}.zip .
          )

          ZIP="out/Hearthroot-NoRoot-${KERNEL_RELEASE}.zip"

          unzip -t "$ZIP" >/dev/null

          for file in anykernel.sh tools/ak3-core.sh Image; do
            unzip -Z -1 "$ZIP" | grep -Fxq "$file" || {
              echo "::error::Missing installer file: $file"
              exit 1
            }
          done

          echo "Hearthroot No Root ZIP structure validated."

      - name: Upload Hearthroot No Root installer
        uses: actions/upload-artifact@v4
        with:
          name: Hearthroot-NoRoot-${{ env.KERNEL_RELEASE }}
          path: out/Hearthroot-NoRoot-${{ env.KERNEL_RELEASE }}.zip
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Hearthroot No Root kernel build"
            echo "- kernel: \`${KERNEL_RELEASE}\` (Image.lz4 = lz4 legacy, magic 02214c18 verified)"
            echo "- build host: EricDark231@Hearthroot-NoRoot"
            echo "- Installer artifact: \`Hearthroot-NoRoot-${KERNEL_RELEASE}\` (download the artifact and extract the flashable ZIP)"
          } >> "$GITHUB_STEP_SUMMARY"
