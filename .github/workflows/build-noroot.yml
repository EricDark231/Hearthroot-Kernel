name: Hearthroot - Test NoRoot

on:
  push:
    branches:
      - hearthroot-noroot
    paths:
      - '.github/workflows/build-noroot.yml'
      - '.github/anykernel/**'
      - 'arch/**'
      - 'block/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'init/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'security/**'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  test:
    name: NoRoot internal build
    uses: EricDark231/Hearthroot-Kernel/.github/workflows/build-one.yml@hearthroot-dev
    with:
      edition: NoRoot
      source_branch: hearthroot-noroot
      source_sha: ${{ github.sha }}
