name: Hearthroot - Test FinaSU

on:
  push:
    branches:
      - Hearthroot-FinaSU
    paths:
      - '.github/workflows/test-finasu-build.yml'
      - 'arch/**'
      - 'block/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'init/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'security/**'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  test:
    name: FinaSU internal build
    uses: EricDark231/Hearthroot-Kernel/.github/workflows/build-one.yml@hearthroot-dev
    with:
      edition: FinaSU
      source_branch: Hearthroot-FinaSU
      source_sha: ${{ github.sha }}
