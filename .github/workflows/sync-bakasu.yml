name: sync-bakasu

# Sync directly from Baka-SU/BakaSU upstream, then
# re-land the kernel module into drivers/kernelsu while preserving the SUSFS integration.
# Rules (per owner):
#   - any conflict or structural surprise -> abort, push nothing, open/update an issue
#   - version pinning per BUILD-GUIDE.md: KSU_VERSION = 30000 + rev-list-count + 700
# NOTE: this workflow does NOT build-test the landed tree; build locally before
# shipping a boot image.

# Keep BakaSU updates manual until the landing workflow has been
# validated against Hearthroot with a real build.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize with sync-android15-6.6-lts (both push to the same branch).
concurrency:
  group: hearthroot-dev-sync
  cancel-in-progress: false

env:
  KERNEL_BRANCH: hearthroot-dev
  BAKASU_REPO_URL: https://github.com/Baka-SU/BakaSU.git
  BAKASU_BRANCH: main
  SUSFS_REPO_URL: https://github.com/omajili-manbu/susfs4ksu.git
  SUSFS_BRANCH: gki-android15-6.6-mod
  ISSUE_TITLE: "[auto-sync] BakaSU sync failed - manual attention needed"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Git identity
        run: |
          git config user.name  "EricDark231"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch BakaSU upstream
        id: bakasu
        run: |
          set -euo pipefail

          git clone \
            --branch "$BAKASU_BRANCH" \
            "$BAKASU_REPO_URL" \
            "$RUNNER_TEMP/bakasu"

          cd "$RUNNER_TEMP/bakasu"

          BAKASU_SHA=$(git rev-parse --short=8 HEAD)
          BAKASU_COUNT=$(git rev-list --count HEAD)
          BAKASU_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo v4.1.0)
          BAKASU_BRANCH_ACTUAL=$(git branch --show-current)

          echo "sha=$BAKASU_SHA" >> "$GITHUB_OUTPUT"
          echo "count=$BAKASU_COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$BAKASU_TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BAKASU_BRANCH_ACTUAL" >> "$GITHUB_OUTPUT"

          {
            echo "### BakaSU upstream"
            echo "- branch: \`$BAKASU_BRANCH_ACTUAL\`"
            echo "- commit: \`$BAKASU_SHA\`"
            echo "- version count: \`$BAKASU_COUNT\`"
            echo "- tag: \`$BAKASU_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Land BakaSU module + refresh SUSFS files
        id: landing
        run: |
          set -euo pipefail
          BAKASU="$RUNNER_TEMP/bakasu"

          # 1) Mirror BakaSU kernel/ into drivers/kernelsu (deletes stale files,
          #    exactly like the manual rsync landing in BUILD-GUIDE.md).
          rsync -a --delete "$BAKASU/kernel/" drivers/kernelsu/

          # 2) Rebuild the real uapi/ directory: the repo's kernel/include/uapi
          #    symlink does not resolve once copied into the kernel tree.
          rm -rf drivers/kernelsu/uapi
          mkdir -p drivers/kernelsu/uapi
          cp "$BAKASU"/uapi/*.h drivers/kernelsu/uapi/

          # 3) SUSFS kernel-side files: the tree carries a matched SUSFS v2.3.0
          #    set (fs/susfs.c + include/linux/susfs{,_def}.h) backing the
          #    already-applied kernel-side hooks (fs/statfs.c, fs/proc/fd.c, ...).
          #    The susfs4ksu -mod fork's fs/susfs.c does NOT implement
          #    susfs_open_redirect_spoof_vfs_statfs/seq_show; overwriting with it
          #    broke the build (run 34705303941, undefined symbols at link).
          #    So the -mod files are only a bootstrap for a tree without SUSFS;
          #    never overwrite SUSFS files that are already present.
          git clone --depth 1 -b "$SUSFS_BRANCH" "$SUSFS_REPO_URL" "$RUNNER_TEMP/susfs"
          SUSFS_SHA=$(git -C "$RUNNER_TEMP/susfs" rev-parse --short=8 HEAD)
          echo "susfs_sha=$SUSFS_SHA" >> "$GITHUB_OUTPUT"
          KP="$RUNNER_TEMP/susfs/kernel_patches"
          if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ] || [ ! -f include/linux/susfs_def.h ]; then
            echo "SUSFS files missing -> bootstrap from $SUSFS_REPO_URL@$SUSFS_BRANCH"
            cp -f "$KP/include/linux/susfs.h"     include/linux/susfs.h
            cp -f "$KP/fs/susfs.c"                fs/susfs.c
            cp -f "$KP/include/linux/susfs_def.h" include/linux/susfs_def.h
            BOOTSTRAPPED=1
          else
            echo "SUSFS kernel-side files present -> left untouched"
          fi

          # 3b) Consistency gate: kernel-side call sites already in the tree must
          #     be backed by fs/susfs.c. Abort (push nothing) on mismatch.
          for sym in susfs_open_redirect_spoof_vfs_statfs susfs_open_redirect_spoof_seq_show; do
            grep -q "$sym" fs/susfs.c || {
              echo "::error::fs/susfs.c does not define $sym - SUSFS kernel-side/version mismatch, aborting"
              exit 1
            }
          done

          # Net-effect markers per owner patch: distinctive strings that only
          # exist in the tree once the patch's changes are in. The tree evolves
          # directly (run 34718663544: 56's reverse-apply failed although its
          # changes were present), so markers - not byte-matching - decide.
          patch_effects_present() {
            case "$1" in
              55_selinux_hook_hide_susfs_artifacts.patch)
                grep -q 'susfs_is_avc_log_spoofing_enabled' fs/proc/array.c &&
                grep -q 'susfs_is_avc_log_spoofing_enabled' security/selinux/avc.c ;;
              56_selinuxfs_hide_sensitive_av.patch)
                grep -q 'susfs_is_avc_log_spoofing_enabled' security/selinux/selinuxfs.c &&
                grep -q 'fsck_untrusted' security/selinux/selinuxfs.c ;;
              *) return 1 ;;
            esac
          }

          # 4) Kernel-side SUSFS patches. Steady state manages only the owner's
          #    55/56 custom patches. The kernel tree is the source of truth and
          #    evolves directly (e.g. 56 was applied on 2026-08-24 and the tree
          #    has moved beyond the exported patch), so a byte-exact reverse
          #    check is wrong: instead use a tri-state - forward-appliable
          #    (apply), net-effect markers present in the tree (skip), and
          #    anything else aborts per the owner rule (conflict/structural
          #    surprise -> abort, push nothing, open an issue).
          #    The upstream-style 50 patch belongs to the bootstrap path only.
          APPLIED=0
          PATCHES=(55_selinux_hook_hide_susfs_artifacts.patch \
                   56_selinuxfs_hide_sensitive_av.patch)
          if [ "${BOOTSTRAPPED:-0}" = "1" ]; then
            PATCHES=(50_add_susfs_in_gki-android15-6.6.patch "${PATCHES[@]}")
          fi
          for p in "${PATCHES[@]}"; do
            if git apply --check "$KP/$p" 2>/tmp/patch-err; then
              echo "$p: not applied yet -> applying"
              git apply "$KP/$p" || { echo "::error::$p failed to apply"; exit 1; }
              APPLIED=1
            elif patch_effects_present "$p"; then
              echo "$p: net effect present in tree -> skipping"
            else
              echo "::error::$p can neither be applied nor is its net effect present - tree/patch mismatch, aborting"
              exit 1
            fi
          done
          echo "patch_applied=$APPLIED" >> "$GITHUB_OUTPUT"

      - name: Pin BakaSU version in drivers/kernelsu/Kbuild
        run: |
          python3 .github/scripts/ksu_pin_version.py \
            --kbuild drivers/kernelsu/Kbuild \
            --count  "${{ steps.bakasu.outputs.count }}" \
            --tag    "${{ steps.bakasu.outputs.tag }}" \
            --sha8   "${{ steps.bakasu.outputs.sha }}" \
            --branch "${{ steps.bakasu.outputs.branch }}"

      - name: Sanity checks (BUILD-GUIDE checklist)
        run: |
          set -euo pipefail
          UAPI_H=$(ls drivers/kernelsu/uapi/*.h | wc -l)
          [ "$UAPI_H" -ge 6 ] || { echo "::error::uapi/ has $UAPI_H headers, expected >= 6"; exit 1; }
          grep -q "KERNEL_SU_VERSION" drivers/kernelsu/include/ksu.h
          grep -q 'KSU_VERSION := $(shell expr 30000' drivers/kernelsu/Kbuild
          grep -q "KSU_COMMIT_SHA  := ${{ steps.bakasu.outputs.sha }}" drivers/kernelsu/Kbuild
          for d in arm64 arm32 x86_64; do
            [ -d "drivers/kernelsu/hook/$d" ] || { echo "::error::missing drivers/kernelsu/hook/$d"; exit 1; }
          done
          test -f fs/susfs.c && test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          echo "all sanity checks passed"

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git add -A
          TRACKED_UAPI=$(git ls-files drivers/kernelsu/uapi | wc -l)
          [ "$TRACKED_UAPI" -ge 6 ] || { echo "::error::uapi headers not tracked (got $TRACKED_UAPI) - .gitignore may be swallowing them"; exit 1; }
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "BakaSU + SUSFS already up to date - nothing to commit"
            {
              echo "### Result"
              echo "- BakaSU \`${{ steps.bakasu.outputs.sha }}\` and SUSFS \`${{ steps.landing.outputs.susfs_sha }}\` were already landed - no commit needed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "drivers/kernelsu: sync BakaSU to ${{ steps.bakasu.outputs.sha }} and pin version ${{ steps.bakasu.outputs.count }}"
            echo ""
            echo "Re-land BakaSU kernel module from $BAKASU_BRANCH (${{ steps.bakasu.outputs.sha }}, tag ${{ steps.bakasu.outputs.tag }})."
            echo "SUSFS kernel-side files preserved in-tree; patch source susfs4ksu $SUSFS_BRANCH (${{ steps.landing.outputs.susfs_sha }})."
            [ "${{ steps.landing.outputs.patch_applied }}" = "1" ] && echo "Kernel-side SUSFS patch(es) were missing and have been re-applied." || true
            echo ""
            echo "Version pinned via vendored Kbuild (no git query):"
            echo "  KSU_LOCAL_VERSION = ${{ steps.bakasu.outputs.count }}"
            echo "  KSU_TAG_NAME      = ${{ steps.bakasu.outputs.tag }}"
            echo "  KSU_COMMIT_SHA    = ${{ steps.bakasu.outputs.sha }}"
            echo "  KSU_BRANCH_NAME   = ${{ steps.bakasu.outputs.branch }}"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "HEAD:$KERNEL_BRANCH"
          {
            echo "### Result"
            echo "- BakaSU landed: \`${{ steps.bakasu.outputs.sha }}\` (version ${{ steps.bakasu.outputs.count }}, tag ${{ steps.bakasu.outputs.tag }})"
            echo "- SUSFS files from susfs4ksu@$SUSFS_BRANCH: \`${{ steps.landing.outputs.susfs_sha }}\`"
            echo "- pushed to \`$KERNEL_BRANCH\`"
            echo "- build verification was NOT run - build locally before shipping"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "The [sync-bakasu run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed."
            echo
            echo "**Nothing should be shipped until the failure is reviewed.**"
            echo
            echo "Common causes:"
            echo "- upstream BakaSU kernel/UAPI structure changed"
            echo "- BakaSU Kbuild structure changed and ksu_pin_version.py aborted"
            echo "- SUSFS kernel-side files or patch markers no longer match"
            echo "- another structural sanity check failed"
          } > /tmp/issue-body.md

          EXISTING=$(gh issue list \
            --state open \
            --search "auto-sync BakaSU sync failed in:title" \
            --json number \
            --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open - not duplicating."
            exit 0
          fi

          gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/issue-body.md
