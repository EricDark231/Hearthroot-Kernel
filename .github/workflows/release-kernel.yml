name: release-kernel

# 手动触发：取最近一次成功的 build-kernel 构建产物，发布 release（默认 prerelease）。
# Release body format: kernel version / build time / toolchain / changes.
#   - 内核版本 / 构建时间 / 构建工具链 从 AK3 包内 Image 的 Linux banner 中提取，
#     提取失败时回退到 artifact 名 / 构建记录时间
#   - 变更内容优先用手动输入的 Markdown，留空时按「上一个 tag..本次构建 commit」自动生成
# 产物（assets）：AnyKernel3 可刷包 + BakaSU manager（release / spoofed，arm64-v8a）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（例如 v1.3）'
        required: true
      title:
        description: '发布标题（留空则用 tag）'
        required: false
        default: ''
      changelog:
        description: '变更内容，Markdown，原样写入正文「变更：」之后（留空则按上个 tag..本次构建 commit 自动生成）'
        required: false
        default: ''
      run_id:
        description: 'build-kernel 运行 ID（留空则取最近一次成功构建）'
        required: false
        default: ''
      prerelease:
        description: '是否标记为 prerelease（true / false）'
        required: false
        default: 'true'

permissions:
  contents: write
  actions: read

env:
  KERNEL_BRANCH: hearthroot-dev
  BUILD_WORKFLOW: build-kernel.yml
  CONTROL_REPO: EricDark231/Hearthroot-Control
  CONTROL_TAG: v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve latest successful build run
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${IN_RUN_ID}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}/runs?branch=${KERNEL_BRANCH}&status=success&per_page=1" \
                     --jq '.workflow_runs[0].id')
          fi
          [ -n "$RUN_ID" ] || { echo "::error::no successful ${BUILD_WORKFLOW} run found on ${KERNEL_BRANCH}"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '"build run: \(.id) (\(.display_title)) head=\(.head_sha) created=\(.created_at)"'
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')
          CREATED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at')
          {
            echo "RUN_ID=${RUN_ID}"
            echo "HEAD_SHA=${HEAD_SHA}"
            echo "RUN_CREATED_AT=${CREATED_AT}"
          } >> "$GITHUB_ENV"

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          AK3_ID=""; AK3_NAME=""; MGR_ID=""; MGR_NAME=""; SPOOF_ID=""; SPOOF_NAME=""
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            case "$name" in
              *-AnyKernel3)                         AK3_ID="$id";   AK3_NAME="$name" ;;
              BakaSU-Manager-Spoofed-arm64-v8a)  SPOOF_ID="$id"; SPOOF_NAME="$name" ;;
              BakaSU-Manager-arm64-v8a)          MGR_ID="$id";   MGR_NAME="$name" ;;
            esac
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
                   --jq '.artifacts[] | select(.expired==false) | "\(.id)\t\(.name)"')
          [ -n "$AK3_ID" ] || { echo "::error::AnyKernel3 artifact not found in run ${RUN_ID}"; exit 1; }
          [ -n "$MGR_ID" ] || { echo "::error::BakaSU Manager artifact missing"; exit 1; }
          [ -n "$SPOOF_ID" ] || { echo "::error::BakaSU Spoofed Manager artifact missing"; exit 1; }
          echo "AK3   : ${AK3_NAME} (${AK3_ID})"
          echo "MGR   : ${MGR_NAME:-<none>} (${MGR_ID:-none})"
          echo "SPOOF : ${SPOOF_NAME:-<none>} (${SPOOF_ID:-none})"

          # AK3 artifact 的 zip 本身就是可刷包，直接下载即用
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AK3_ID}/zip" > "$RUNNER_TEMP/dl/ak3.zip"
          unzip -oq "$RUNNER_TEMP/dl/ak3.zip" -d "$RUNNER_TEMP/dl/ak3"
          test -f "$RUNNER_TEMP/dl/ak3/Image" || { echo "::error::Image blob missing in AnyKernel3 artifact"; exit 1; }

          # manager artifact 里是 apk，需要解包取出
          for pair in "${MGR_ID:-}|mgr" "${SPOOF_ID:-}|spoof"; do
            aid="${pair%%|*}"; d="${pair##*|}"
            [ -n "$aid" ] || continue
            mkdir -p "$RUNNER_TEMP/dl/$d"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > "$RUNNER_TEMP/dl/$d.zip"
            unzip -oq "$RUNNER_TEMP/dl/$d.zip" -d "$RUNNER_TEMP/dl/$d"
          done
          ls -la "$RUNNER_TEMP/dl/ak3" "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" 2>/dev/null || true

          {
            echo "AK3_PATH=${RUNNER_TEMP}/dl/ak3.zip"
            echo "AK3_NAME=${AK3_NAME}"
          } >> "$GITHUB_ENV"

      - name: Download Hearthroot No Root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NOROOT_RUN=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-noroot.yml/runs?branch=hearthroot-noroot&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          [ -n "$NOROOT_RUN" ] || {
            echo "::error::No successful No Root build found"
            exit 1
          }

          NOROOT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${NOROOT_RUN}" \
            --jq '.head_sha')

          NOROOT_ARTIFACT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${NOROOT_RUN}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false and (.name | startswith("Hearthroot-NoRoot-"))) | .id' | head -n1)

          [ -n "$NOROOT_ARTIFACT" ] || {
            echo "::error::No Root artifact missing"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/dl/noroot"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${NOROOT_ARTIFACT}/zip" \
            > "$RUNNER_TEMP/dl/noroot-artifact.zip"

          unzip -oq "$RUNNER_TEMP/dl/noroot-artifact.zip" \
            -d "$RUNNER_TEMP/dl/noroot"

          NOROOT_ZIP=$(find "$RUNNER_TEMP/dl/noroot" \
            -type f -name 'Hearthroot-NoRoot-*.zip' -print -quit)

          [ -n "$NOROOT_ZIP" ] || {
            echo "::error::Flashable No Root ZIP missing"
            exit 1
          }

          unzip -tq "$NOROOT_ZIP" >/dev/null

          for file in anykernel.sh tools/ak3-core.sh Image; do
            unzip -Z -1 "$NOROOT_ZIP" | grep -Fxq "$file" || {
              echo "::error::Missing No Root installer file: $file"
              exit 1
            }
          done

          NOROOT_VERSION=$(basename "$NOROOT_ZIP" .zip)
          NOROOT_VERSION="${NOROOT_VERSION#Hearthroot-NoRoot-}"
          NOROOT_SHORT="${NOROOT_VERSION%%-*}"

          {
            echo "NOROOT_PATH=$NOROOT_ZIP"
            echo "NOROOT_SHORT=$NOROOT_SHORT"
            echo "NOROOT_SHA=$NOROOT_SHA"
          } >> "$GITHUB_ENV"

          echo "No Root: $NOROOT_VERSION"
          echo "Build: $NOROOT_RUN ($NOROOT_SHA)"

      - name: Download Hearthroot Control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTROL_FILE="Hearthroot-Control-${CONTROL_TAG}.zip"
          mkdir -p "$RUNNER_TEMP/dl/control"

          gh release download "$CONTROL_TAG" \
            --repo "$CONTROL_REPO" \
            --pattern "$CONTROL_FILE" \
            --dir "$RUNNER_TEMP/dl/control"

          CONTROL_PATH="$RUNNER_TEMP/dl/control/$CONTROL_FILE"
          test -s "$CONTROL_PATH" || {
            echo "::error::Hearthroot Control ZIP missing or empty"
            exit 1
          }

          unzip -tq "$CONTROL_PATH" >/dev/null || {
            echo "::error::Invalid Hearthroot Control ZIP"
            exit 1
          }

          echo "CONTROL_PATH=$CONTROL_PATH" >> "$GITHUB_ENV"
          echo "CONTROL_FILE=$CONTROL_FILE" >> "$GITHUB_ENV"
          echo "Hearthroot Control: $CONTROL_TAG"

      - name: Extract kernel banner (version / build time / toolchain)
        run: |
          set -euo pipefail
          REL_FROM_ARTIFACT="${AK3_NAME#Hearthroot-rodin-}"
          REL_FROM_ARTIFACT="${REL_FROM_ARTIFACT%-AnyKernel3}"
          KREL="$REL_FROM_ARTIFACT"
          BLDTIME="$(date -u -d "$RUN_CREATED_AT" '+%a %b %e %H:%M:%S UTC %Y')"
          TOOLCHAIN="clang-r596125"
          BANNER_FOUND=""

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lz4 binutils
          RAW="$RUNNER_TEMP/Image.raw"
          if lz4 -d -f "$RUNNER_TEMP/dl/ak3/Image" "$RAW" 2>/dev/null; then
            BANNER=$(strings -n 16 "$RAW" | grep -m1 -E '^Linux version [^ ]+ \(' || true)
          fi
          if [ -n "${BANNER:-}" ]; then
            echo "banner: $BANNER"
            P_REL=$(printf '%s\n' "$BANNER" | sed -E 's/^Linux version ([^ ]+).*/\1/')
            P_TIME=$(printf '%s\n' "$BANNER" | sed -nE 's/.*\) (# [0-9]+ .*)$/\1/p')
            P_TC=$(printf '%s\n' "$BANNER" | sed -nE 's/^Linux version [^ ]+ \([^)]*\) \((.*)\) # [0-9]+ .*$/\1/p')
            [ -n "$P_REL" ] && KREL="$P_REL" && BANNER_FOUND=yes
            [ -n "$P_TIME" ] && BLDTIME="$P_TIME"
            [ -n "$P_TC" ] && TOOLCHAIN="$P_TC"
          fi
          if [ -z "$BANNER_FOUND" ]; then
            echo "::warning::could not parse kernel banner from Image, falling back to artifact name / run time"
          fi

          SHORT="$(printf '%s' "$KREL" | cut -d- -f1)"
          {
            echo "KREL=${KREL}"
            echo "SHORT=${SHORT}"
            echo "BLDTIME=${BLDTIME}"
            echo "TOOLCHAIN=${TOOLCHAIN}"
          } >> "$GITHUB_ENV"
          echo "内核版本：$KREL"
          echo "构建时间：$BLDTIME"
          echo "构建工具链：$TOOLCHAIN"

      - name: Prepare changelog
        run: |
          set -euo pipefail
          CHANGES_FILE="$RUNNER_TEMP/changes.md"
          if [ -n "$CHANGELOG_INPUT" ]; then
            printf '%s\n' "$CHANGELOG_INPUT" > "$CHANGES_FILE"
            echo "using manual changelog"
          else
            echo "::warning::changelog input empty - generating from commits"
            PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ -n "$PREV_TAG" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              RANGE="${PREV_TAG}..${HEAD_SHA}"
            else
              RANGE="HEAD"
            fi
            echo "commit range: ${RANGE} (prev tag: ${PREV_TAG:-<none>})"
            git log -n 8 --no-merges --pretty='- %s' "$RANGE" > "$CHANGES_FILE" || true
            [ -s "$CHANGES_FILE" ] || printf '%s\n' 'Kernel maintenance and upstream synchronization.' > "$CHANGES_FILE"
          fi
          echo "----- changes.md -----"
          cat "$CHANGES_FILE"
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}

      - name: Create release
        env:
          # 本仓库是 fork，org/repo 的 workflow 默认权限为只读，GITHUB_TOKEN 创建 release
          # 会被拒（HTTP 403: Resource not accessible by integration），因此改用 PAT
          PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.tag }}
          IN_TITLE: ${{ inputs.title }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -n "${PAT}" ]; then
            export GH_TOKEN="${PAT}"
          else
            echo "::warning::secret GH_PAT not set, falling back to GITHUB_TOKEN"
            export GH_TOKEN="${GITHUB_TOKEN}"
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          {
            cat <<'HEADER'
            # 🌿 Hearthroot Kernel

            **Custom Android kernel for POCO X7 Pro (rodin)**

            Hearthroot focuses on performance, stability, efficiency and customization,
            while preserving compatibility with the device's native hardware behavior.

            This release includes two kernel variants: **Root** and **No Root**,
            alongside Hearthroot Control and the BakaSU managers.

            ## 🌱 Kernel Variants

            ### 1. Hearthroot Root

            The complete Hearthroot experience, featuring integrated root support
            and advanced kernel modifications.

            **Features:**
            - BakaSU with SUSFS integration
            - ADIOS 3.3.0 I/O scheduler
            - CPU and performance optimizations
            - BBRv3 + fq networking
            - ZSTD 1.5.7 and ZRAM with LZ4
            - Cortex-A725 tuning
            - ThinLTO + AutoFDO
            - Baseband Guard (BBG)

            ### 2. Hearthroot No Root

            A streamlined variant for users who prefer a kernel without
            integrated root support.

            **Features:**
            - No integrated BakaSU or SUSFS
            - Kyber as the preferred I/O scheduler
            - mq-deadline and BFQ available
            - Hearthroot build identity
            - Flashable AnyKernel3 installer

            **Note:** No Root refers to the kernel configuration.
            It does not necessarily prevent using a separate root implementation.

            ## 🍃 Hearthroot Control

            The companion management module for Hearthroot.

            **Features:**
            - Performance and battery profiles
            - CPU governor and I/O scheduler controls
            - Xiaomi Parts integration
            - Integrated Hearthroot Companion
            - Seasonal themes and customizable interface

          HEADER

            printf '**Included version:** `%s`\n\n' "$CONTROL_TAG"

            printf '## 🔧 Build Information\n\n'
            printf '| Component | Version |\n'
            printf '|---|---|\n'
            printf '| Hearthroot Root | `%s` |\n' "$KREL"
            printf '| Hearthroot No Root | `%s` |\n' "$NOROOT_SHORT"
            printf '| Device | POCO X7 Pro (`rodin`) |\n\n'

            printf '**Root build date:** `%s`\n\n' "$BLDTIME"
            printf '**Toolchain:** `%s`\n\n' "$TOOLCHAIN"

            printf '## 📦 Downloads\n\n'

            printf '1. **Hearthroot Root:** `Hearthroot-Root-%s.zip`\n' "$SHORT"
            printf '2. **Hearthroot No Root:** `Hearthroot-NoRoot-%s.zip`\n' "$NOROOT_SHORT"
            printf '3. **Hearthroot Control:** `%s`\n' "$CONTROL_FILE"
            printf '4. **BakaSU Manager:** standard APK\n'
            printf '5. **BakaSU Spoofed Manager:** alternative APK\n\n'

            cat <<'FOOTER'
            ## 🔧 Compatibility & Installation

            **Device:** POCO X7 Pro (`rodin`)

            **Recovery:** OrangeFox recommended. Other AOSP recoveries
            have not been fully validated.

            **Installation:** Flash only one kernel variant using a
            compatible recovery. Do not install Root and No Root together.

            Hearthroot Control is installed separately through a compatible
            root manager. Its Companion APK can be installed using Volume UP
            during module installation.

            **Xiaomi Parts:** Integration has been tested with the TeamMEX_XDA
            device-tree implementation. Compatibility with the IDO implementation
            remains unverified.

            ## ⚠️ Important Notes

            - Root and No Root are alternative kernel builds, not installation stages.
            - BakaSU Manager is intended for configurations using BakaSU.
            - Some Hearthroot Control features require root access.
            - Functionality may vary depending on the ROM and root configuration.
            - Back up important data before flashing.

            ## 📝 Changelog

          FOOTER

            cat "$RUNNER_TEMP/changes.md"
          } > "$NOTES"
          echo "----- release notes -----"
          cat "$NOTES"

          if gh release view "$IN_TAG" >/dev/null 2>&1; then
            echo "::error::release ${IN_TAG} already exists"; exit 1
          fi

          mkdir -p out
          (
            cd "$RUNNER_TEMP/dl/ak3"
            zip -qr "$GITHUB_WORKSPACE/out/Hearthroot-Root-${SHORT}.zip" .
          )
          cp "$NOROOT_PATH" "out/Hearthroot-NoRoot-${NOROOT_SHORT}.zip"

          ASSETS=(
            "out/Hearthroot-Root-${SHORT}.zip"
            "out/Hearthroot-NoRoot-${NOROOT_SHORT}.zip"
          )
          cp "$CONTROL_PATH" "out/$CONTROL_FILE"
          ASSETS+=("out/$CONTROL_FILE")
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            cp "$apk" "out/$(basename "$apk")"
            ASSETS+=("out/$(basename "$apk")")
          done < <(find "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" -type f -name '*.apk' 2>/dev/null | sort)
          ls -la out

          # Validate the complete release before publishing.
          [ "${#ASSETS[@]}" -eq 5 ] || {
            echo "::error::Expected exactly five release assets, found ${#ASSETS[@]}"
            exit 1
          }

          for asset in "${ASSETS[@]}"; do
            [ -s "$asset" ] || {
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            }
          done

          for kernel_zip in "out/Hearthroot-Root-${SHORT}.zip" "out/Hearthroot-NoRoot-${NOROOT_SHORT}.zip"; do
            unzip -tq "$kernel_zip" >/dev/null || {
              echo "::error::Invalid kernel ZIP: $kernel_zip"
              exit 1
            }

            for required in anykernel.sh Image tools/ak3-core.sh; do
              if ! unzip -Z -1 "$kernel_zip" | grep -Fxq "$required"; then
                echo "::error::Missing $required in $kernel_zip"
                exit 1
              fi
            done
          done

          echo "All five release assets validated."

          EXTRA=()
          if [ "${IN_PRERELEASE}" != "false" ]; then
            EXTRA+=(--prerelease)
          else
            EXTRA+=(--latest)
          fi

          gh release create "$IN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${HEAD_SHA:-$KERNEL_BRANCH}" \
            --title "${IN_TITLE:-$IN_TAG}" \
            --notes-file "$NOTES" \
            "${EXTRA[@]}" \
            "${ASSETS[@]}"

          gh release view "$IN_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url --jq '"released \(.tagName) prerelease=\(.isPrerelease) \(.url)"' \
            >> "$GITHUB_STEP_SUMMARY"
