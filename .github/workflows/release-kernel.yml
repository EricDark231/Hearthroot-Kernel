name: Hearthroot - Unified release

# Manual only. A successful build-all.yml run is the only kernel source.
# Release assets are numbered in the requested display order.
# Dry-run by default: validate and upload a private release candidate artifact.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful build-all.yml run ID containing the three kernels'
        required: true
        type: string
      tag:
        description: 'Release tag, for example v1.5.0'
        required: true
        type: string
      title:
        description: 'Optional release title'
        required: false
        type: string
      changelog:
        description: 'Optional release notes appended after the asset list'
        required: false
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: true
        default: true
        type: boolean
      publish:
        description: 'Actually publish to GitHub Releases (false = audit only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: hearthroot-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and optionally publish unified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Collect and verify official artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          run_id = os.environ['RUN_ID']
          root = Path(os.environ['RUNNER_TEMP']) / 'hearthroot-unified-release'
          kernels = root / 'downloaded-kernels'
          ready = root / 'assets'
          source = root / 'source'
          for directory in (kernels, ready, source):
              directory.mkdir(parents=True, exist_ok=True)

          if not re.fullmatch(r'[1-9][0-9]{5,15}', run_id):
              sys.exit('Invalid build run ID')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,63}', tag):
              sys.exit('Invalid release tag')

          def command(*args, stdout=None):
              return subprocess.run(args, check=True, stdout=stdout)

          def gh_json(endpoint):
              result = subprocess.run(
                  ['gh', 'api', endpoint], check=True, capture_output=True, text=True
              )
              return json.loads(result.stdout)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def check_zip(path, required=()):
              if not path.is_file() or path.stat().st_size == 0:
                  sys.exit(f'Missing or empty ZIP: {path}')
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      sys.exit(f'Corrupt ZIP: {path}')
                  if not set(required).issubset(archive.namelist()):
                      sys.exit(f'Incomplete ZIP: {path}')

          def validate_asset_digest(path, release_asset):
              digest = release_asset.get('digest') or ''
              if digest:
                  if not digest.startswith('sha256:'):
                      sys.exit(f'Unexpected upstream digest: {digest}')
                  if sha256(path) != digest.removeprefix('sha256:'):
                      sys.exit(f'Upstream digest mismatch: {path.name}')

          def download_release_asset(upstream, version, asset, dest):
              if dest.exists():
                  sys.exit(f'Duplicate release file: {dest.name}')
              command('gh', 'release', 'download', version, '--repo', upstream,
                      '--pattern', asset['name'], '--dir', str(dest.parent))
              if not dest.is_file():
                  sys.exit(f'Upstream release asset missing: {asset["name"]}')
              validate_asset_digest(dest, asset)

          # 1. The kernels MUST all belong to this specific successful build-all run.
          run = gh_json(f'repos/{repo}/actions/runs/{run_id}')
          if (run.get('conclusion') != 'success' or
                  run.get('status') != 'completed' or
                  run.get('head_branch') != 'hearthroot-dev' or
                  run.get('path') != '.github/workflows/build-all.yml' or
                  run.get('repository', {}).get('full_name') != repo):
              sys.exit('Run is not a successful official build-all.yml execution')

          artifact_data = gh_json(f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          required_artifacts = {f'kernel-{name}' for name in ('Original', 'FinaSU', 'NoRoot')}
          found = {a['name'] for a in artifact_data['artifacts']
                   if not a.get('expired') and a['name'] in required_artifacts}
          if found != required_artifacts:
              sys.exit(f'Missing kernel artifacts: {sorted(required_artifacts - found)}')
          command('gh', 'run', 'download', run_id, '--repo', repo,
                  '--pattern', 'kernel-*', '--dir', str(kernels))

          branches = {'FinaSU': 'Hearthroot-FinaSU',
                      'Original': 'hearthroot-dev',
                      'NoRoot': 'hearthroot-noroot'}
          manifests = {}
          required_ak3 = ('anykernel.sh', 'tools/ak3-core.sh', 'Image',
                          'META-INF/com/google/android/update-binary')
          for edition, branch in branches.items():
              directory = kernels / f'kernel-{edition}'
              manifest = json.loads((directory / f'manifest-{edition}.json').read_text())
              filename = manifest.get('filename', '')
              if manifest.get('edition') != edition or manifest.get('branch') != branch:
                  sys.exit(f'Manifest edition or branch mismatch: {edition}')
              if not re.fullmatch(r'[0-9a-f]{40}', manifest.get('commit', '')):
                  sys.exit(f'Invalid source commit: {edition}')
              if not re.fullmatch(
                  rf'Hearthroot-{edition}-rodin-[A-Za-z0-9._+-]+-AnyKernel3\.zip',
                  filename
              ):
                  sys.exit(f'Invalid ZIP name: {edition}')
              if edition == 'Original' and manifest['commit'] != run['head_sha']:
                  sys.exit('Original commit differs from build-all run head')
              kernel_zip = directory / filename
              if sha256(kernel_zip) != manifest.get('zip_sha256'):
                  sys.exit(f'Kernel ZIP checksum mismatch: {edition}')
              check_zip(kernel_zip, required_ak3)
              with zipfile.ZipFile(kernel_zip) as archive:
                  digest = hashlib.sha256()
                  with archive.open('Image') as image:
                      magic = image.read(4)
                      digest.update(magic)
                      for chunk in iter(lambda: image.read(1024 * 1024), b''):
                          digest.update(chunk)
                  if magic.hex() != '02214c18':
                      sys.exit(f'Non-legacy LZ4 kernel: {edition}')
                  if digest.hexdigest() != manifest.get('image_sha256'):
                      sys.exit(f'Kernel Image checksum mismatch: {edition}')
              shutil.copy2(kernel_zip, ready / filename)
              manifests[edition] = manifest
              print(f'OK kernel: {edition} {manifest["commit"][:12]}')

          # 2. Official FinaSU v1.4.4 Manager for FinaSU v1.4.2 kernel.
          finasu_repo, finasu_tag = 'LyraVoid/FinaSU', 'v1.4.4'
          finasu_kbuild_data = gh_json(
              f'repos/{repo}/contents/drivers/kernelsu/Kbuild?ref='
              f'{manifests["FinaSU"]["commit"]}'
          )
          finasu_kbuild = base64.b64decode(
              finasu_kbuild_data['content']).decode('utf-8')
          if not re.search(r'^KSU_VERSION\s*:=\s*33155\s*$',
                           finasu_kbuild, re.MULTILINE):
              sys.exit('FinaSU kernel source version does not match 33155')
          if 'v1.4.2-96104eac@Hearthroot-FinaSU' not in finasu_kbuild:
              sys.exit('FinaSU source identity does not match expected v1.4.2')
          finasu_assets = gh_json(f'repos/{finasu_repo}/releases/tags/{finasu_tag}')['assets']
          finasu_normal_name = 'FinaSU_v1.4.4_33167-release.apk'
          normal_assets = [a for a in finasu_assets if a['name'] == finasu_normal_name]
          if len(normal_assets) != 1:
              sys.exit('Official FinaSU v1.4.4 manager APK not found')
          finasu_normal = ready / finasu_normal_name
          download_release_asset(finasu_repo, finasu_tag, normal_assets[0], finasu_normal)
          if sha256(finasu_normal) != (
              'f0a378e62cc62e25ad255bb1d942bdc4c8c8d632543263790bc8a2300244c932'
          ):
              sys.exit('Official FinaSU manager SHA256 mismatch')
          check_zip(finasu_normal)
          finasu_spoof_assets = [a for a in finasu_assets if
                                  a['name'].lower().endswith('.apk') and
                                  'spoof' in a['name'].lower()]
          if len(finasu_spoof_assets) > 1:
              sys.exit('Multiple upstream FinaSU spoofed APKs; manual review required')
          finasu_spoof = None
          if finasu_spoof_assets:
              finasu_spoof = ready / finasu_spoof_assets[0]['name']
              download_release_asset(finasu_repo, finasu_tag,
                                     finasu_spoof_assets[0], finasu_spoof)
              check_zip(finasu_spoof)
          else:
              print('FinaSU has no official spoofed manager in this release')

          # 3. Resolve BakaSU commit from the actual Original build's Kbuild.
          kbuild_data = gh_json(
              f'repos/{repo}/contents/drivers/kernelsu/Kbuild?ref='
              f'{manifests["Original"]["commit"]}'
          )
          kbuild = base64.b64decode(kbuild_data['content']).decode('utf-8')
          pins = re.findall(r'^KSU_COMMIT_SHA\s*:=\s*([0-9a-f]{8})\s*$',
                            kbuild, re.MULTILINE)
          if len(pins) != 1:
              sys.exit('Exactly one literal BakaSU commit pin is required')
          bakasu_pin = pins[0]
          bakasu_repo = 'Baka-SU/BakaSU'
          complete = None
          normal_only = None
          for page in range(1, 6):
              candidate_runs = gh_json(
                  f'repos/{bakasu_repo}/actions/workflows/build-manager.yml/runs?'
                  f'branch=main&status=success&per_page=100&page={page}'
              )['workflow_runs']
              for candidate in candidate_runs:
                  if not candidate.get('head_sha', '').startswith(bakasu_pin):
                      continue
                  artifacts = gh_json(
                      f'repos/{bakasu_repo}/actions/runs/{candidate["id"]}/artifacts?per_page=100'
                  )['artifacts']
                  usable = {a['name']: a for a in artifacts if not a.get('expired')}
                  normal = usable.get('Manager-release')
                  spoof = usable.get('Spoofed-Manager-release')
                  if normal:
                      choice = (candidate, normal, spoof)
                      if spoof:
                          complete = choice
                          break
                      if not normal_only:
                          normal_only = choice
              if complete:
                  break
          selected = complete or normal_only
          if not selected:
              sys.exit(f'No unexpired BakaSU manager matching kernel SHA {bakasu_pin}')
          bakasu_run, bakasu_release, bakasu_spoof_asset = selected

          def extract_bakasu_apk(artifact, spoofed):
              artifact_zip = source / f'bakasu-{artifact["id"]}.zip'
              with artifact_zip.open('wb') as output:
                  command('gh', 'api',
                          f'repos/{bakasu_repo}/actions/artifacts/{artifact["id"]}/zip',
                          stdout=output)
              with zipfile.ZipFile(artifact_zip) as archive:
                  candidates = [member for member in archive.infolist()
                                if not member.is_dir() and
                                member.filename.lower().endswith('.apk') and
                                'arm64-v8a' in Path(member.filename).name.lower()]
                  if len(candidates) != 1:
                      sys.exit('Expected exactly one arm64-v8a APK in BakaSU artifact')
                  name = Path(candidates[0].filename).name
                  if spoofed and 'spoof' not in name.lower():
                      if name.endswith('-release.apk'):
                          name = name[:-len('-release.apk')] + '-spoofed-release.apk'
                      else:
                          name = name[:-len('.apk')] + '-spoofed.apk'
                  destination = ready / name
                  if destination.exists():
                      sys.exit(f'Duplicate BakaSU APK name: {name}')
                  with archive.open(candidates[0]) as source_apk:
                      with destination.open('xb') as output:
                          shutil.copyfileobj(source_apk, output)
              check_zip(destination)
              return destination

          bakasu_normal = extract_bakasu_apk(bakasu_release, False)
          bakasu_spoof = (extract_bakasu_apk(bakasu_spoof_asset, True)
                          if bakasu_spoof_asset else None)
          if not bakasu_spoof:
              print('Matching BakaSU run has no unexpired spoofed Manager artifact')
          print(f'BakaSU manager: run {bakasu_run["id"]}, SHA {bakasu_run["head_sha"]}')

          # 4. Download the already released Hearthroot Control package.
          control_repo, control_tag = 'EricDark231/Hearthroot-Control', 'v1.0.0'
          control_name = 'Hearthroot-Control-v1.0.0.zip'
          control_assets = gh_json(f'repos/{control_repo}/releases/tags/{control_tag}')['assets']
          control_matches = [a for a in control_assets if a['name'] == control_name]
          if len(control_matches) != 1:
              sys.exit('Hearthroot Control v1.0.0 asset not found')
          control = ready / control_name
          download_release_asset(control_repo, control_tag, control_matches[0], control)
          check_zip(control)

          # Use numeric prefixes because GitHub sorts release assets by filename.
          # Prefix only the published copies; source build manifests are preserved.
          ordered = [
              ('FinaSU kernel', ready / manifests['FinaSU']['filename']),
              ('FinaSU Manager', finasu_normal),
              *(([('FinaSU Spoofed Manager', finasu_spoof)]) if finasu_spoof else []),
              ('BakaSU kernel (Original)', ready / manifests['Original']['filename']),
              ('BakaSU Manager', bakasu_normal),
              *(([('BakaSU Spoofed Manager', bakasu_spoof)]) if bakasu_spoof else []),
              ('NoRoot kernel', ready / manifests['NoRoot']['filename']),
              ('Hearthroot Control', control),
          ]
          if len({p.name for _, p in ordered}) != len(ordered):
              sys.exit('Duplicate asset names are not allowed')
          for _, path in ordered:
              if not path.is_file() or path.stat().st_size == 0:
                  sys.exit(f'Missing release asset {path}')

          source_asset_names = {label: path.name for label, path in ordered}
          numbered = []
          for index, (label, path) in enumerate(ordered, start=1):
              published_path = path.with_name(f'{index:02d}-{path.name}')
              if published_path.exists():
                  sys.exit(f'Conflicting release asset: {published_path.name}')
              path.rename(published_path)
              numbered.append((label, published_path))
          ordered = numbered
          published_names = {label: path.name for label, path in ordered}

          published_manifests = {}
          for edition, manifest in manifests.items():
              key = {
                  'Original': 'BakaSU kernel (Original)',
                  'FinaSU': 'FinaSU kernel',
                  'NoRoot': 'NoRoot kernel',
              }[edition]
              published_manifests[edition] = {
                  **manifest,
                  'source_filename': manifest['filename'],
                  'filename': published_names[key],
              }

          release_asset_order = [
              {
                  'position': index,
                  'component': label,
                  'source_filename': source_asset_names[label],
                  'filename': path.name,
                  'sha256': sha256(path),
              }
              for index, (label, path) in enumerate(ordered, start=1)
          ]

          notes = ['# Hearthroot Kernel', '',
                   '**Device:** POCO X7 Pro (`rodin`)  ',
                   f'**Validated CI run:** `{run_id}`  ',
                   '**Build:** Android 15 / Linux 6.6.144', '',
                   '## 1. FinaSU', '',
                   f'- Kernel: `{published_names["FinaSU kernel"]}`',
                   f'- Official Manager: `{published_names["FinaSU Manager"]}`']
          if finasu_spoof:
              notes.append(f'- Official Spoofed Manager: `{published_names["FinaSU Spoofed Manager"]}`')
          else:
              notes.append('- Spoofed Manager: not available in the official v1.4.4 release')
          notes += ['', '## 2. BakaSU (Hearthroot Original)', '',
                    f'- Kernel: `{published_names["BakaSU kernel (Original)"]}`',
                    f'- Standard Manager: `{published_names["BakaSU Manager"]}`']
          if bakasu_spoof:
              notes.append(f'- Spoofed Manager: `{published_names["BakaSU Spoofed Manager"]}`')
          else:
              notes.append('- Spoofed Manager: not available in the verified artifacts')
          notes += ['', f'**Commit BakaSU:** `{bakasu_run["head_sha"]}`',
                    '', '## 3. NoRoot', '',
                    f'- Kernel without built-in root: `{published_names["NoRoot kernel"]}`',
                    '', '## 4. Hearthroot Control', '',
                    f'- Module: `{published_names["Hearthroot Control"]}`', '',
                    '## Provenance and safety', '',
                    f'- [Verified combined build](https://github.com/{repo}/actions/runs/{run_id})',
                    '- Each kernel ZIP includes its own image, verified against the build manifest.',
                    '- Install only **one** kernel edition; never flash multiple editions together.',
                    '- Back up the boot partition before flashing.',
                    '- Passing CI does not replace boot testing on the device.', '']
          changelog = os.environ.get('RELEASE_CHANGELOG', '').strip()
          if changelog:
              notes += ['## Changes', '', changelog, '']

          audit = root / 'audit'
          audit.mkdir(exist_ok=True)
          (audit / 'release-notes.md').write_text('\n'.join(notes) + '\n')
          (audit / 'assets.lst').write_text('\n'.join(str(p) for _, p in ordered) + '\n')
          (audit / 'SHA256SUMS.txt').write_text(
              ''.join(f'{sha256(p)}  {p.name}\n' for _, p in ordered))
          (audit / 'sources.json').write_text(json.dumps({
              'kernel_run_id': int(run_id),
              'kernel_run_head_sha': run['head_sha'],
              'kernels': published_manifests,
              'release_asset_order': release_asset_order,
              'finasu_manager_release': f'{finasu_repo}:{finasu_tag}',
              'bakasu_manager_run': bakasu_run['id'],
              'bakasu_manager_sha': bakasu_run['head_sha'],
              'hearthroot_control_release': f'{control_repo}:{control_tag}'
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TARGET_SHA={run["head_sha"]}\n')

          print('\nVerified release order:')
          for label, path in ordered:
              print(f'  {label}: {path.name}  SHA256={sha256(path)}')
          print(f'Ready: {len(ordered)} release assets; NO public release created')
          PY

      - name: Upload verified candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Hearthroot-release-candidate-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/hearthroot-unified-release/assets/*
            ${{ runner.temp }}/hearthroot-unified-release/audit/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified assets to GitHub Releases
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: $TAG"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          ROOT="$RUNNER_TEMP/hearthroot-unified-release"
          mapfile -t ASSETS < "$ROOT/audit/assets.lst"
          test "${#ASSETS[@]}" -ge 6
          EXTRA=()
          if [ "$PRERELEASE" = true ]; then
            EXTRA+=(--prerelease)
          else
            EXTRA+=(--latest)
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "${RELEASE_TITLE:-$TAG}" \
            --notes-file "$ROOT/audit/release-notes.md" \
            "${EXTRA[@]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets \
            --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
